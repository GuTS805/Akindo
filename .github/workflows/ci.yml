name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std@v1.17.0 OpenZeppelin/openzeppelin-contracts@v5.4.0 --no-git
      - run: forge build --sizes
      - name: Unit, fuzz, recovery and invariant tests
        run: forge test -vv
      - name: Fork test against the live Mezo testnet
        # One backend behind the public RPC can lag days behind; a fork that reads from it fails
        # at once. Retry before failing.
        run: forge test --mc '^ForkTest' -vv || (sleep 30 && forge test --mc '^ForkTest' -vv) || (sleep 60 && forge test --mc '^ForkTest' -vv)
        env:
          MEZO_TESTNET_RPC: https://rpc.test.mezo.org
      - name: Fork test against Mezo mainnet (real MUSD, pool and MEZO gauge)
        # Public RPC: retry once before failing.
        run: forge test --mc MainnetForkTest -vv || (sleep 30 && forge test --mc MainnetForkTest -vv)
        env:
          MEZO_MAINNET_RPC: https://mezo.drpc.org

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
